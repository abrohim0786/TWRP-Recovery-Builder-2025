name: TWRP Recovery Builder for Xiaomi Redmi K40 Gaming & Poco F3 GT

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'TWRP Manifest Branch'
        required: true
        default: 'twrp-12.1'
        type: choice
        options:
        - twrp-14.1
        - twrp-12.1
        - twrp-11
      DEVICE_TREE_BRANCH:
        description: 'Device Tree Branch' 
        required: true
        default: 'TWRP-12.1'
      BUILD_TARGET:
        description: 'Build Target' 
        required: true
        default: 'boot'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot
      RECOVERY_INSTALLER:
        description: 'Include recovery installer.zip'
        type: boolean
        required: true
        default: true

jobs:
  build:
    name: Build TWRP for K40 Gaming/F3 GT by ツ๛abrohim๛
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEVICE_NAME: ares
      DEVICE_PATH: device/xiaomi/ares
      DEVICE_TREE: https://github.com/abrohim0786/device_xiaomi_ares.git
      CCACHE_DIR: /tmp/ccache
      USE_CCACHE: 1
      CCACHE_COMPRESS: 1
      CCACHE_MAXSIZE: 15G

    steps:
    - name: 🚀 Initialize Build
      uses: actions/checkout@v4

    - name: ⚡ Setup Turbo Cache
      uses: actions/cache@v3
      with:
        path: /tmp/ccache
        key: ccache-${{ github.run_id }}

    - name: 🛠️ Install Build Tools
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update -qq
        sudo apt-get install -y ccache coreutils software-properties-common
        sudo add-apt-repository universe -y
        sudo apt-get update -qq
        ccache -M 15G
        sudo apt-get -y install \
          gperf \
          libncurses6 \
          libncurses-dev \
          libncurses-dev:i386 \
          gcc-multilib \
          g++-multilib \
          lib32z-dev \
          libgl1-mesa-dev \
          libxml2-utils \
          xsltproc \
          bc \
          libsdl1.2-dev \
          libwxgtk3.2-dev \
          lzop \
          pngcrush \
          schedtool \
          squashfs-tools \
          imagemagick \
          libbz2-dev \
          liblzma-dev \
          ncftp \
          libstdc++-10-dev \
          libtinfo6 \
          libgflags-dev \
          repo \
          git-lfs \
          curl

    - name: ☕ Install Java
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: 8

    - name: 📥 Setup Repo Environment
      run: |
        mkdir -p ~/bin
        curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo
        
        git config --global user.name "ツ๛abrohim๛"
        git config --global user.email "callofduty.pubg786@gmail.com"
        
        # Select manifest
        if [[ "${{ github.event.inputs.MANIFEST_BRANCH }}" =~ ^twrp-(11|12.1|14.1)$ ]]; then
          MANIFEST_URL="https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git"
        else
          MANIFEST_URL="https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git"
        fi

        mkdir workspace
        cd workspace
        repo init --depth=1 --no-repo-verify -u $MANIFEST_URL -b ${{ github.event.inputs.MANIFEST_BRANCH }}

    - name: 🔄 Sync Source Code
      run: |
        cd workspace
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: 🌳 Clone Device Tree
      run: |
        cd workspace
        git clone ${{ env.DEVICE_TREE }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ env.DEVICE_PATH }}
        echo "COMMIT_ID=$(cd ${{ env.DEVICE_PATH }} && git rev-parse --short HEAD)" >> $GITHUB_ENV

    - name: 🔍 Find Device Makefile
      run: |
        cd workspace/${{ env.DEVICE_PATH }}
        if [ -f twrp_${{ env.DEVICE_NAME }}.mk ]; then
          echo "DEVICE_MAKEFILE=twrp_${{ env.DEVICE_NAME }}" >> $GITHUB_ENV
        elif [ -f omni_${{ env.DEVICE_NAME }}.mk ]; then
          echo "DEVICE_MAKEFILE=omni_${{ env.DEVICE_NAME }}" >> $GITHUB_ENV
        else
          echo "::error::❌ No device makefile found!"
          exit 1
        fi

    - name: 🐍 Configure Python
      if: ${{ contains(github.event.inputs.MANIFEST_BRANCH, 'twrp-9.0') }}
      run: |
        sudo apt-get install -y python2
        sudo ln -sf /usr/bin/python2 /usr/bin/python

    - name: ⚙️ Build Recovery Image
      timeout-minutes: 120
      run: |
        cd workspace
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        lunch ${{ env.DEVICE_MAKEFILE }}-eng
        make -j$(nproc --all) ${{ github.event.inputs.BUILD_TARGET }}image
        echo "BUILD_DATE=$(date +'%Y-%m-%d %H:%M')" >> $GITHUB_ENV
        echo "BUILD_VERSION=${{ env.DEVICE_MAKEFILE }}-${{ github.run_number }}" >> $GITHUB_ENV

    - name: 📦 Package Artifacts
      run: |
        cd workspace/out/target/product/${{ env.DEVICE_NAME }}
        BUILD_FILE="${{ github.event.inputs.BUILD_TARGET }}.img"
        
        # Generate MD5 checksum
        md5sum $BUILD_FILE > $BUILD_FILE.md5
        
        # Create installer if requested
        if [ "${{ github.event.inputs.RECOVERY_INSTALLER }}" = "true" ]; then
          wget -q https://github.com/kinguser981/recovery-installer/releases/latest/download/recovery-installer.zip
          zip -ur recovery-installer.zip $BUILD_FILE
        fi

    - name: 🚀 Create Release
      uses: softprops/action-gh-release@v1
      with:
        name: "TWRP ${{ github.event.inputs.BUILD_TARGET }} for Xiaomi Redmi K40 Gaming & Poco F3 GT (${{ env.BUILD_VERSION }})"
        tag_name: ${{ env.BUILD_VERSION }}
        body: |
          ### 🔧 Custom TWRP Build for Xiaomi Redmi K40 Gaming & Poco F3 GT (ares)
          
          **Builder:** ツ๛abrohim๛  
          **Build Date:** ${{ env.BUILD_DATE }}  
          **Build ID:** [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          
          **Build Details**  
          - Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}  
          - Device Tree: [${{ env.DEVICE_TREE }}@${{ github.event.inputs.DEVICE_TREE_BRANCH }}](${{ env.DEVICE_TREE }}/tree/${{ github.event.inputs.DEVICE_TREE_BRANCH }})  
          - Commit: [${{ env.COMMIT_ID }}](${{ env.DEVICE_TREE }}/commit/${{ env.COMMIT_ID }})  
          - Target: ${{ github.event.inputs.BUILD_TARGET }}  
          
          **Download:**  
          - Recovery Image: `${{ github.event.inputs.BUILD_TARGET }}.img`  
          - Installer ZIP: `recovery-installer.zip` (if enabled)
          
          **Verification:**  
          ```bash
          md5sum: $(cat ${{ github.event.inputs.BUILD_TARGET }}.img.md5)
          ```
        files: |
          workspace/out/target/product/${{ env.DEVICE_NAME }}/${{ github.event.inputs.BUILD_TARGET }}.img
          workspace/out/target/product/${{ env.DEVICE_NAME }}/${{ github.event.inputs.BUILD_TARGET }}.img.md5
          workspace/out/target/product/${{ env.DEVICE_NAME }}/recovery-installer.zip
        draft: false
        prerelease: false

    - name: 🎉 Build Complete
      run: |
        echo "================================================"
        echo "✅ TWRP build completed successfully!"
        echo "📦 Artifacts available in GitHub Releases"
        echo "🔧 Built by ツ๛abrohim๛ for Xiaomi Redmi K40 Gaming & Poco F3 GT"
        echo "================================================"
