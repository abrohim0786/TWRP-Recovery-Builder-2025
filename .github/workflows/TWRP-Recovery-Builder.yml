#
# TWRP Recovery Builder - Upgraded by Gemini
#
# This workflow is designed to build TWRP recovery from source.
# It includes several enhancements for stability, speed, and customization.
#

name: TWRP Recovery Builder (Upgraded)

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'Custom Minimal-Manifest URL (optional)'
        required: false
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git'
      MANIFEST_BRANCH:
        description: 'TWRP Minimal-Manifest Branch'
        required: true
        default: 'twrp-12.1'
        type: choice
        options:
          - twrp-14.1
          - twrp-12.1
          - twrp-11
          - twrp-9.0
      DEVICE_TREE:
        description: 'Custom Recovery Tree URL'
        required: true
        default: 'https://github.com/abrohim0786/device_xiaomi_ares.git'
      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch'
        required: true
        default: 'TWRP-12.1'
      DEVICE_PATH:
        description: 'Specify your Device Path (e.g., device/xiaomi/ares)'
        required: true
        default: 'device/xiaomi/ares'
      DEVICE_NAME:
        description: 'Specify your Device Codename (e.g., ares)'
        required: true
        default: 'ares'
      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'boot'
        type: choice
        options:
          - boot
          - recovery
          - vendorboot
      UPLOAD_RECOVERY_LOGS:
        description: 'Upload build logs as an artifact'
        type: boolean
        required: true
        default: true
      RECOVERY_INSTALLER:
        description: 'Include recovery installer.zip'
        type: boolean
        required: true
        default: true
      RECOVERY_TAR:
        description: 'Create recovery.tar for Samsung devices'
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build TWRP for ${{ github.event.inputs.DEVICE_NAME }}
    runs-on: ubuntu-22.04
    # This ensures the workflow only runs in the main repository, not on forks.
    if: github.event.repository.owner.id == github.event.sender.id
    permissions:
      contents: write # Required for creating releases
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Add your Telegram secrets to the repository for notifications
      # TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      # TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Display Build Information
      run: |
        echo "========================================"
        echo "         TWRP BUILDER (UPGRADED)        "
        echo "========================================"
        echo "::group::Build Configuration"
        echo "Manifest URL: ${{ github.event.inputs.MANIFEST_URL }}"
        echo "Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
        echo "Device Tree: ${{ github.event.inputs.DEVICE_TREE }}"
        echo "Device Branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
        echo "Device Path: ${{ github.event.inputs.DEVICE_PATH }}"
        echo "Device Codename: ${{ github.event.inputs.DEVICE_NAME }}"
        echo "Build Target: ${{ github.event.inputs.BUILD_TARGET }}image"
        echo "Upload Logs: ${{ github.event.inputs.UPLOAD_RECOVERY_LOGS }}"
        echo "Include Installer: ${{ github.event.inputs.RECOVERY_INSTALLER }}"
        echo "Create .tar: ${{ github.event.inputs.RECOVERY_TAR }}"
        echo "::endgroup::"

    - name: Maximize Build Space
      uses: easimon/maximize-build-space@v10
      with:
        root-reserve-mb: 512
        swap-size-mb: 12288 # 12 GB Swap
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'

    - name: Set up Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libwxgtk3.0-gtk3-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3
        # Symlink python
        sudo ln -sf /usr/bin/python3 /usr/bin/python

    - name: Install OpenJDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '8'

    - name: Install git-repo
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Set up ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-${{ github.event.inputs.DEVICE_NAME }}-${{ github.event.inputs.MANIFEST_BRANCH }}-${{ github.run_id }}
        restore-keys: |
          ccache-${{ github.event.inputs.DEVICE_NAME }}-${{ github.event.inputs.MANIFEST_BRANCH }}-

    - name: Initialize Repo
      run: |
        mkdir -p workspace
        cd workspace
        git config --global user.name "Your Name"
        git config --global user.email "your-email@example.com"
        repo init -u ${{ github.event.inputs.MANIFEST_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }} --depth=1 --git-lfs
        # Clone device tree
        git clone ${{ github.event.inputs.DEVICE_TREE }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
        # Get the latest commit hash for the release notes
        cd ${{ github.event.inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV
        cd ../..

    - name: Repo Sync
      run: |
        cd workspace
        repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune --force-sync -j$(nproc --all)

    - name: Set up Build
      run: |
        cd workspace
        source build/envsetup.sh
        # Check for makefile and export it
        if [ -f ${{ github.event.inputs.DEVICE_PATH }}/twrp.mk ]; then
            MAKEFILE_NAME=$(basename ${{ github.event.inputs.DEVICE_PATH }}/twrp.mk .mk)
            export DEVICE_MAKEFILE=${MAKEFILE_NAME}
            lunch ${{ DEVICE_MAKEFILE }}-eng
        elif [ -f ${{ github.event.inputs.DEVICE_PATH }}/omni_${{ github.event.inputs.DEVICE_NAME}}.mk ]; then
            export DEVICE_MAKEFILE=omni_${{ github.event.inputs.DEVICE_NAME}}
            lunch ${{ DEVICE_MAKEFILE }}-eng
        else
            echo "❌ No suitable recovery makefile found!"
            exit 1
        fi
        echo "DEVICE_MAKEFILE=${DEVICE_MAKEFILE}" >> $GITHUB_ENV

    - name: Start Building Recovery
      run: |
        cd workspace
        source build/envsetup.sh
        lunch ${{ env.DEVICE_MAKEFILE }}-eng
        export ALLOW_MISSING_DEPENDENCIES=true
        export CCACHE_EXEC=$(which ccache)
        export USE_CCACHE=1
        ccache -M 50G
        ccache -z
        # Start the build process and pipe the output to a log file
        make ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all) 2>&1 | tee build.log
        ccache -s

    - name: Prepare Artifacts and Release Info
      id: prep
      run: |
        cd workspace
        # Define the output directory
        OUT_DIR="out/target/product/${{ github.event.inputs.DEVICE_NAME }}"
        # Check if the build image exists
        if [ -f "${OUT_DIR}/${{ github.event.inputs.BUILD_TARGET }}.img" ]; then
          IMG_PATH="${OUT_DIR}/${{ github.event.inputs.BUILD_TARGET }}.img"
          echo "Build successful: ${IMG_PATH} found."
        else
          echo "❌ Build failed: Image not found in ${OUT_DIR}!"
          # Upload build log on failure
          if [ ${{ github.event.inputs.UPLOAD_RECOVERY_LOGS }} = true ]; then
            mv build.log recovery_build_failed.log
            echo "::set-output name=UPLOAD_LOG_PATH::recovery_build_failed.log"
          fi
          exit 1
        fi

        # Create Installer Zip if requested
        if [ ${{ github.event.inputs.RECOVERY_INSTALLER }} = true ]; then
          wget -q https://github.com/kinguser981/recovery-installer/releases/download/zip/recovery-installer.zip -P ${OUT_DIR}
          zip -j -r ${OUT_DIR}/TWRP_${{ github.event.inputs.DEVICE_NAME }}_Installer.zip ${OUT_DIR}/recovery-installer.zip ${IMG_PATH}
        fi

        # Create TAR for Samsung if requested
        if [ ${{ github.event.inputs.RECOVERY_TAR }} = true ]; then
          tar -cvf ${OUT_DIR}/TWRP_${{ github.event.inputs.DEVICE_NAME }}.tar -C ${OUT_DIR} ${{ github.event.inputs.BUILD_TARGET }}.img
        fi

        # Set variables for release
        echo "::set-output name=BUILD_DATE::$(date +%Y-%m-%d)"
        echo "::set-output name=IMG_MD5::$(md5sum ${IMG_PATH} | cut -d' ' -f1)"
        echo "::set-output name=OUT_DIR::${OUT_DIR}"
        # Upload build log on success
        if [ ${{ github.event.inputs.UPLOAD_RECOVERY_LOGS }} = true ]; then
          mv build.log recovery_build_success.log
          echo "::set-output name=UPLOAD_LOG_PATH::recovery_build_success.log"
        fi

    - name: Upload Build Logs
      if: always() && steps.prep.outputs.UPLOAD_LOG_PATH
      uses: actions/upload-artifact@v4
      with:
        name: recovery-build-logs-${{ github.run_id }}
        path: workspace/${{ steps.prep.outputs.UPLOAD_LOG_PATH }}

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: "TWRP for ${{ github.event.inputs.DEVICE_NAME }} | ${{ steps.prep.outputs.BUILD_DATE }}"
        tag_name: "twrp-${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}"
        body: |
          ## Unofficial TWRP Build

          This is an automated build of TWRP for the **${{ github.event.inputs.DEVICE_NAME }}**.

          - **Build Date:** ${{ steps.prep.outputs.BUILD_DATE }}
          - **Manifest Branch:** `${{ github.event.inputs.MANIFEST_BRANCH }}`
          - **Device Tree Commit:** [${{ env.COMMIT_ID }}](${{ github.event.inputs.DEVICE_TREE }}/commit/${{ env.COMMIT_ID }})
          - **Image MD5:** `${{ steps.prep.outputs.IMG_MD5 }}`

          **Note:** Always back up your data before flashing. Use at your own risk.
        files: |
          ${{ steps.prep.outputs.OUT_DIR }}/TWRP_*.zip
          ${{ steps.prep.outputs.OUT_DIR }}/TWRP_*.tar
          ${{ steps.prep.outputs.OUT_DIR }}/${{ github.event.inputs.BUILD_TARGET }}.img
        fail_on_unmatched_files: false

    # - name: Send Telegram Notification
    #   if: always() # This ensures the step runs even if the build fails
    #   uses: appleboy/telegram-action@master
    #   with:
    #     to: ${{ env.TELEGRAM_CHAT_ID }}
    #     token: ${{ env.TELEGRAM_BOT_TOKEN }}
