name: TWRP Recovery Builder ares 2025 (16-Cores)

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'TWRP Minimal-Manifest Branch'
        required: true
        default: 'twrp-12.1'
        type: choice
        options:
        - twrp-14.1
        - twrp-12.1
        - twrp-11
        - twrp-9.0
      DEVICE_TREE:
        description: 'Custom Recovery Tree' 
        required: true
        default: 'https://github.com/abrohim0786/device_xiaomi_ares.git'
      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch' 
        required: true
        default: 'TWRP-12.1'
      DEVICE_PATH:
        description: 'Specify your Device Path' 
        required: true
        default: 'device/xiaomi/ares'
      DEVICE_NAME:
        description: 'Specify your Device Codename' 
        required: true
        default: 'ares'
      BUILD_TARGET:
        description: 'Specify your Build Target' 
        required: true
        default: 'boot'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot
      LDCHECK:
        description: 'Path of blobs to check (optional, leave empty if not needed)' 
        required: false
        default: ''
      RECOVERY_INSTALLER:
        description: 'Include recovery installer.zip'
        type: boolean
        required: true
        default: true

jobs:
  build:
    name: Build TWRP by ${{ github.actor }}
    runs-on: ubuntu-latest-16-cores
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
    - name: Check Out
      uses: actions/checkout@v4
      
    - name: Display Inputs (Rainbow Style)
      run: |
        echo -e "\e[31m::group::User Environment Variables\e[0m"
        echo -e "\e[32mDisplaying variables/inputs.\e[0m"
        echo -e "\e[33mManifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}\e[0m"
        echo -e "\e[34mDevice Tree: ${{ github.event.inputs.DEVICE_TREE }}\e[0m"
        echo -e "\e[35mDevice Branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}\e[0m"
        echo -e "\e[36mDevice Path: ${{ github.event.inputs.DEVICE_PATH }}\e[0m"
        echo -e "\e[31mDevice Name: ${{ github.event.inputs.DEVICE_NAME }}\e[0m"
        echo -e "\e[32mBuild Target: ${{ github.event.inputs.BUILD_TARGET }}image\e[0m"
        echo -e "\e[33mInclude Recovery Installer: ${{ github.event.inputs.RECOVERY_INSTALLER }}\e[0m"
        echo -e "\e[34m::endgroup::\e[0m"

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main
      
    - name: Free space before swap
      run: |
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        sudo docker rmi $(sudo docker images -q) || true

    - name: Set Swap Space (Safe Mode)
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24
        
    - name: Cache APT packages
      uses: actions/cache@v4
      with:
        path: |
          /var/lib/apt/lists
          /var/cache/apt/archives
        key: ${{ runner.os }}-apt-${{ hashFiles('**/Dockerfile', '.github/workflows/*.yml') }}
        restore-keys: |
          ${{ runner.os }}-apt-

    - name: Prepare the environment (Rainbow Style)
      run: |
        echo -e "\e[35mUpdating and installing dependencies...\e[0m"
        sudo apt update
        sudo apt -y upgrade
        sudo dpkg --add-architecture i386
        sudo apt update
        sudo apt -y install gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib ncurses-dev x11proto-core-dev lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libsdl1.2-dev libwxgtk3.2-dev lzop pngcrush schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libtinfo6 libgflags-dev
        sudo add-apt-repository universe
        sudo apt -y install libncurses6 libncurses6:i386
        echo -e "\e[32mDependencies installed successfully!\e[0m"
       
    - name: Install OpenJDK
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: 8

    - name: Install Git-Repo
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Check Manifest Branch
      uses: haya14busa/action-cond@v1
      id: manifest
      with:
        cond: ${{ github.event.inputs.MANIFEST_BRANCH == 'twrp-11' || github.event.inputs.MANIFEST_BRANCH == 'twrp-12.1'  || github.event.inputs.MANIFEST_BRANCH == 'twrp-14.1' }}
        if_true: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
        if_false: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git

    - name: Cache Repo Sync and Ccache
      uses: actions/cache@v4
      with:
        path: |
          ~/.ccache
          workspace
        key: ${{ runner.os }}-build-${{ github.event.inputs.MANIFEST_BRANCH }}-${{ github.event.inputs.DEVICE_NAME }}-${{ hashFiles('workspace/.repo/manifests/*.xml') }}
        restore-keys: |
          ${{ runner.os }}-build-${{ github.event.inputs.MANIFEST_BRANCH }}-${{ github.event.inputs.DEVICE_NAME }}-
          ${{ runner.os }}-build-

    - name: Initialize Repo
      run: |
        mkdir -p workspace
        cd workspace
        git config --global user.name "abrohim0786"
        git config --global user.email "callofduty.pubg786@gmail.com"
        repo init --depth=1 -u ${{ steps.manifest.outputs.value }} -b ${{ github.event.inputs.MANIFEST_BRANCH }}
  
    - name: Repo Sync (Rainbow Style)
      run: |
        echo -e "\e[36mSyncing repository...\e[0m"
        cd workspace
        repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle
        echo -e "\e[32mRepo sync completed!\e[0m"

    - name: Clone Device Tree
      run: |
        echo -e "\e[35mCloning device tree...\e[0m"
        cd workspace
        git clone ${{ github.event.inputs.DEVICE_TREE }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
        cd ${{ github.event.inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV
        echo -e "\e[32mDevice tree cloned successfully!\e[0m"

    - name: Check Build Makefile
      run: |
        cd workspace
        if [ -f ${{ github.event.inputs.DEVICE_PATH }}/twrp_${{ github.event.inputs.DEVICE_NAME}}.mk ]; then
            echo "DEVICE_MAKEFILE=twrp_${{ github.event.inputs.DEVICE_NAME }}" >> $GITHUB_ENV
            echo -e "\e[32mFound twrp makefile!\e[0m"
        elif [ -f ${{ github.event.inputs.DEVICE_PATH }}/omni_${{ github.event.inputs.DEVICE_NAME}}.mk ]; then
            echo "DEVICE_MAKEFILE=omni_${{ github.event.inputs.DEVICE_NAME }}" >> $GITHUB_ENV
            echo -e "\e[32mFound omni makefile!\e[0m"
        else
            echo -e "\e[31mNo recovery makefile file found!\e[0m"
        fi
      continue-on-error: true
      
    - name: Install Python 2
      if: github.event.inputs.MANIFEST_BRANCH != 'twrp-11' && github.event.inputs.MANIFEST_BRANCH != 'twrp-12.1'  && github.event.inputs.MANIFEST_BRANCH != 'twrp-14'
      run: |
        sudo apt -y install python2
        cd /usr/bin
        sudo ln -sf python2 python

    - name: Building Image (Rainbow Style)
      run: |
        echo -e "\e[35mStarting build process...\e[0m"
        cd workspace
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export CCACHE_DIR=~/.ccache
        export CCACHE_EXEC=/usr/bin/ccache
        ccache -M 50G
        ccache -z
        lunch ${{ env.DEVICE_MAKEFILE }}-eng && make clean && make ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all)
        echo -e "\e[32mDone building your ${{ github.event.inputs.BUILD_TARGET }}.img!\e[0m"
      
    - name: Set Build Date
      run: |
        echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
        DEVICE_TREE_URL="${{ github.event.inputs.DEVICE_TREE }}"
        if [[ "${DEVICE_TREE_URL}" == *.git ]]; then
          DEVICE_TREE_URL="${DEVICE_TREE_URL%.git}"
        fi
        echo "DEVICE_TREE_URL=${DEVICE_TREE_URL}" >> $GITHUB_ENV

    - name: Check if Recovery Exist (Rainbow Style)
      run: |
        cd workspace
        if [ -f out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery.img ]; then
            echo "RECOVERY_TYPE=recovery" >> $GITHUB_ENV
            echo -e "\e[32mrecovery.img file found!\e[0m"
            echo "MD5_IMG=$(md5sum out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ github.event.inputs.BUILD_TARGET }}.img | cut -d ' ' -f 1)" >> $GITHUB_ENV
        elif [ -f out/target/product/${{ github.event.inputs.DEVICE_NAME }}/boot.img ]; then
            echo "RECOVERY_TYPE=boot" >> $GITHUB_ENV
            echo -e "\e[32mboot.img file found!\e[0m"
            echo "MD5_IMG=$(md5sum out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ github.event.inputs.BUILD_TARGET }}.img | cut -d ' ' -f 1)" >> $GITHUB_ENV
        elif [ -f out/target/product/${{ github.event.inputs.DEVICE_NAME }}/vendor_boot.img ]; then
            echo "RECOVERY_TYPE=vendor_boot" >> $GITHUB_ENV
            echo -e "\e[32mvendor_boot.img file found!\e[0m"
            echo "MD5_IMG=$(md5sum out/target/product/${{ github.event.inputs.DEVICE_NAME }}/vendor_boot.img | cut -d ' ' -f 1)" >> $GITHUB_ENV
        else
            echo -e "\e[31mNo Recovery file found!\e[0m"
            cd Exit
        fi

    - name: Include Recovery Installer
      run: |
        if [ ${{ github.event.inputs.RECOVERY_INSTALLER }} = true ]; then
          echo -e "\e[36mAdding recovery installer...\e[0m"
          cd workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/
          wget https://github.com/kinguser981/recovery-installer/releases/download/zip/recovery-installer.zip
          zip -ur recovery-installer.zip ${{ env.RECOVERY_TYPE }}.img
          echo -e "\e[32mRecovery installer added!\e[0m"
        fi
      continue-on-error: true
        
    - name: Upload to Release (Rainbow Style)
      uses: softprops/action-gh-release@v1
      with:
        files: |
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery-installer.zip
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ env.RECOVERY_TYPE }}.img
        name: Unofficial TWRP for ${{ github.event.inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          \e[31mManifest: ${{ github.event.inputs.MANIFEST_BRANCH }}\e[0m
          \e[32mTarget: ${{ github.event.inputs.BUILD_TARGET}}.img\e[0m
          \e[33mDevice: [Device Tree/Branch](${{ env.DEVICE_TREE_URL }}/${{ github.event.inputs.DEVICE_TREE_BRANCH }})\e[0m
          \e[34mCommit: Most recent [commit](${{ env.DEVICE_TREE_URL }}/commit/${{ env.COMMIT_ID }}) during building.\e[0m
          \e[35mMD5 (img): ${{ env.MD5_IMG }}\e[0m

    - name: Checking For Missing Dependencies
      run: |
        if [ -n "${{ github.event.inputs.LDCHECK }}" ]; then
          echo -e "\e[36mChecking for missing dependencies...\e[0m"
          cd tools
          mv -n libneeds ${GITHUB_WORKSPACE}/workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery/root/
          mv -n ldcheck ${GITHUB_WORKSPACE}/workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery/root/
          cd ../workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery/root
          python3 ldcheck -p system/lib64:vendor/lib64:system/lib:vendor/lib -d ${{ github.event.inputs.LDCHECK }}
          echo -e "\e[32mDependency check completed!\e[0m"
        else
          echo -e "\e[33mLDCHECK input not provided, skipping dependency check.\e[0m"
        fi
      continue-on-error: true

    - name: Release ramdisk-recovery
      uses: softprops/action-gh-release@4634c16e79c963813287e889244c50009e7f0981
      with:
        files: |
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/obj/PACKAGING/vendor_ramdisk_fragments_intermediates/recovery.*
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/ramdisk-recovery.*
        name: Unofficial TWRP for ${{ github.event.inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          \e[31mManifest: ${{ github.event.inputs.MANIFEST_BRANCH }}\e[0m
          \e[32mTarget: ${{ github.event.inputs.BUILD_TARGET}}.img\e[0m
          \e[33mDevice: [Device Tree/Branch](${{ env.DEVICE_TREE_URL }}/${{ github.event.inputs.DEVICE_TREE_BRANCH }})\e[0m
          \e[34mCommit: Most recent [commit](${{ env.DEVICE_TREE_URL }}/commit/${{ env.COMMIT_ID }}) during building.\e[0m
          \e[35mMD5 (img): ${{ env.MD5_IMG }}\e[0m
