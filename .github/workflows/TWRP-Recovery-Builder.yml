name: TWRP Recovery Builder by ツ๛abrohim๛

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'TWRP Minimal-Manifest Branch'
        required: true
        default: 'twrp-12.1'
        type: choice
        options:
        - twrp-14.1
        - twrp-12.1
        - twrp-11
        - twrp-9.0
      DEVICE_TREE:
        description: 'Custom Recovery Tree' 
        required: true
        default: 'https://github.com/abrohim0786/device_xiaomi_ares.git'
      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch' 
        required: true
        default: 'TWRP-12.1'
      DEVICE_PATH:
        description: 'Specify your Device Path' 
        required: true
        default: 'device/xiaomi/ares'
      DEVICE_NAME:
        description: 'Specify your Device Codename' 
        required: true
        default: 'ares'
      BUILD_TARGET:
        description: 'Specify your Build Target' 
        required: true
        default: 'boot'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot
      LDCHECK:
        description: 'Path of blobs to check' 
        required: true
        default: 'system/bin/qseecomd'
      RECOVERY_TAR:
        description: 'Release Recovery.tar For Samsung devices'
        required: false
        default: false
        type: boolean
      RECOVERY_INSTALLER:
        description: 'Include recovery installer.zip'
        type: boolean
        required: true
        default: true

jobs:
  build:
    name: Build TWRP by ツ๛abrohim๛
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_AUTHOR: "ツ๛abrohim๛"
    permissions:
      contents: write

    steps:
    - name: Check Out
      uses: actions/checkout@v4
      
    - name: Display Inputs
      run: |
        echo "::group::Build Configuration"
        echo "Builder: ${{ env.BUILD_AUTHOR }}"
        echo "Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
        echo "Device Tree: ${{ github.event.inputs.DEVICE_TREE }}"
        echo "Device Branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
        echo "Device Path: ${{ github.event.inputs.DEVICE_PATH }}"
        echo "Device Name: ${{ github.event.inputs.DEVICE_NAME }}"
        echo "Build Target: ${{ github.event.inputs.BUILD_TARGET }}"
        echo "::endgroup::"

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main
      
    - name: Free space before swap
      run: |
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        sudo docker rmi $(sudo docker images -q) || true

    - name: Set Swap Space (Safe Mode)
      uses: pierotofy/set-swarm-space@master
      with:
        swap-size-gb: 24
        
    - name: Prepare the environment
      run: |
        sudo apt update
        sudo apt -y upgrade
        sudo dpkg --add-architecture i386
        sudo apt update
        sudo apt -y install gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib ncurses-dev x11proto-core-dev lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libsdl1.2-dev libwxgtk3.2-dev lzop pngcrush schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libtinfo6 libgflags-dev
        sudo add-apt-repository universe
        sudo apt -y install libncurses6 libncurses6:i386
        
    - name: Install OpenJDK
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: 8

    - name: Install Git-Repo
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Check Manifest Branch
      uses: haya14busa/action-cond@v1
      id: manifest
      with:
        cond: ${{ github.event.inputs.MANIFEST_BRANCH == 'twrp-11' || github.event.inputs.MANIFEST_BRANCH == 'twrp-12.1'  || github.event.inputs.MANIFEST_BRANCH == 'twrp-14.1' }}
        if_true: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
        if_false: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git

    - name: Initialize Repo
      run: |
        mkdir workspace
        cd workspace
        git config --global user.name "${{ env.BUILD_AUTHOR }}"
        git config --global user.email "callofduty.pubg786@gmail.com"
        repo init --depth=1 -u ${{ steps.manifest.outputs.value }} -b ${{ github.event.inputs.MANIFEST_BRANCH }}
  
    - name: Repo Sync
      run: |
        cd workspace
        repo sync -j$(nproc --all) --force-sync

    - name: Clone Device Tree
      run: |
        cd workspace
        git clone ${{ github.event.inputs.DEVICE_TREE }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
        cd ${{ github.event.inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: Check Build Makefile
      run: |
        cd workspace
        if [ -f ${{ github.event.inputs.DEVICE_PATH }}/twrp_${{ github.event.inputs.DEVICE_NAME}}.mk ]; then
            echo "DEVICE_MAKEFILE=twrp_${{ github.event.inputs.DEVICE_NAME }}" >> $GITHUB_ENV
        elif [ -f ${{ github.event.inputs.DEVICE_PATH }}/omni_${{ github.event.inputs.DEVICE_NAME}}.mk ]; then
            echo "DEVICE_MAKEFILE=omni_${{ github.event.inputs.DEVICE_NAME }}" >> $GITHUB_ENV
        else
            echo "No recovery makefile found!"
        fi
      continue-on-error: true
      
    - name: Install Python 2
      if: github.event.inputs.MANIFEST_BRANCH != 'twrp-11' && github.event.inputs.MANIFEST_BRANCH != 'twrp-12.1'  && github.event.inputs.MANIFEST_BRANCH != 'twrp-14'
      run: |
        sudo apt -y install python2
        cd /usr/bin
        sudo ln -sf python2 python

    - name: Building Image 
      run: |
        cd workspace
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        lunch ${{ env.DEVICE_MAKEFILE }}-eng && make clean && make ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all)
        echo "Done building your ${{ github.event.inputs.BUILD_TARGET }}.img"
      
    - name: Set Build Metadata
      run: |
        echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
        echo "BUILD_TIME=$(date +%H%M)" >> $GITHUB_ENV
        DEVICE_TREE_URL="${{ github.event.inputs.DEVICE_TREE }}"
        if [[ "${DEVICE_TREE_URL}" == *.git ]]; then
          DEVICE_TREE_URL="${DEVICE_TREE_URL%.git}"
        fi
        echo "DEVICE_TREE_URL=${DEVICE_TREE_URL}" >> $GITHUB_ENV

    - name: Check Build Output
      run: |
        cd workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}
        if [ -f recovery.img ]; then
            echo "RECOVERY_TYPE=recovery" >> $GITHUB_ENV
            echo "RECOVERY_FILE=recovery.img" >> $GITHUB_ENV
            echo "MD5_IMG=$(md5sum recovery.img | cut -d ' ' -f 1)" >> $GITHUB_ENV
        elif [ -f boot.img ]; then
            echo "RECOVERY_TYPE=boot" >> $GITHUB_ENV
            echo "RECOVERY_FILE=boot.img" >> $GITHUB_ENV
            echo "MD5_IMG=$(md5sum boot.img | cut -d ' ' -f 1)" >> $GITHUB_ENV
        elif [ -f vendor_boot.img ]; then
            echo "RECOVERY_TYPE=vendor_boot" >> $GITHUB_ENV
            echo "RECOVERY_FILE=vendor_boot.img" >> $GITHUB_ENV
            echo "MD5_IMG=$(md5sum vendor_boot.img | cut -d ' ' -f 1)" >> $GITHUB_ENV
        else
            echo "No recovery file found!"
            exit 1
        fi

    - name: Include Recovery Installer
      if: ${{ github.event.inputs.RECOVERY_INSTALLER }}
      run: |
        cd workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}
        wget -q https://github.com/kinguser981/recovery-installer/releases/download/zip/recovery-installer.zip
        zip -ur recovery-installer.zip ${{ env.RECOVERY_FILE }}
        echo "INSTALLER_EXISTS=true" >> $GITHUB_ENV
      continue-on-error: true
        
    - name: Create Recovery Tar
      if: ${{ github.event.inputs.RECOVERY_TAR }}
      run: |
        cd workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}
        tar -cvf ${{ env.RECOVERY_TYPE }}.tar ${{ env.RECOVERY_FILE }}
        echo "TAR_EXISTS=true" >> $GITHUB_ENV
      continue-on-error: true
        
    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v1
      id: create_release
      with:
        files: |
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ env.RECOVERY_FILE }}
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery-installer.zip
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ env.RECOVERY_TYPE }}.tar
        name: "TWRP ${{ env.RECOVERY_TYPE }} for ${{ github.event.inputs.DEVICE_NAME }} (${{ env.BUILD_DATE }})"
        tag_name: "${{ github.event.inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}-${{ env.BUILD_TIME }}"
        body: |
          ### TWRP Recovery by ${{ env.BUILD_AUTHOR }}
          **Device:** ${{ github.event.inputs.DEVICE_NAME }}
          **Build Type:** ${{ env.RECOVERY_TYPE }}
          **Build Date:** ${{ env.BUILD_DATE }} ${{ env.BUILD_TIME }}
          
          **Source Information:**
          - Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
          - Device Tree: [${{ github.event.inputs.DEVICE_TREE_BRANCH }}](${{ env.DEVICE_TREE_URL }}/tree/${{ github.event.inputs.DEVICE_TREE_BRANCH }})
          - Commit: [${{ env.COMMIT_ID }}](${{ env.DEVICE_TREE_URL }}/commit/${{ env.COMMIT_ID }})
          
          **MD5:** `${{ env.MD5_IMG }}`

    # Telegram Integration
    - name: Prepare Telegram Notification
      run: |
        echo "BUILD_LOG_URL=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> $GITHUB_ENV
        echo "RELEASE_URL=${{ steps.create_release.outputs.html_url }}" >> $GITHUB_ENV
        echo "ARTIFACTS_DIR=workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}" >> $GITHUB_ENV

    - name: Prepare Telegram Assets
      run: |
        cd ${{ env.ARTIFACTS_DIR }}
        mkdir -p telegram_assets
        # Copy only existing files
        [ -f ${{ env.RECOVERY_FILE }} ] && cp ${{ env.RECOVERY_FILE }} telegram_assets/
        [ -f recovery-installer.zip ] && cp recovery-installer.zip telegram_assets/
        [ ${{ github.event.inputs.RECOVERY_TAR }} = true ] && [ -f ${{ env.RECOVERY_TYPE }}.tar ] && cp ${{ env.RECOVERY_TYPE }}.tar telegram_assets/
        echo "ARTIFACTS_COUNT=$(ls -1 telegram_assets 2>/dev/null | wc -l)" >> $GITHUB_ENV

    - name: Compress Assets for Telegram
      if: ${{ env.ARTIFACTS_COUNT > 0 }}
      run: |
        cd ${{ env.ARTIFACTS_DIR }}
        tar -zcvf telegram_assets.tar.gz telegram_assets/
        echo "TELEGRAM_ASSETS=$(pwd)/telegram_assets.tar.gz" >> $GITHUB_ENV

    - name: Send Telegram Success Notification
      if: ${{ success() && env.ARTIFACTS_COUNT > 0 }}
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        message: |
          <b>✅ TWRP Build Completed Successfully!</b>
          <b>Builder:</b> <code>${{ env.BUILD_AUTHOR }}</code>
          <b>Device:</b> <code>${{ github.event.inputs.DEVICE_NAME }}</code>
          <b>Type:</b> <code>${{ env.RECOVERY_TYPE }}</code>
          <b>Date:</b> <code>${{ env.BUILD_DATE }} ${{ env.BUILD_TIME }}</code>
          
          <b>📦 Artifacts:</b> <code>${{ env.ARTIFACTS_COUNT }}</code> files
          <b>🔗 GitHub Release:</b> <a href="${{ env.RELEASE_URL }}">Download</a>
          <b>📝 Build Logs:</b> <a href="${{ env.BUILD_LOG_URL }}">View</a>
          
          <b>MD5:</b> <code>${{ env.MD5_IMG }}</code>
        format: html

    - name: Upload Assets to Telegram
      if: ${{ success() && env.ARTIFACTS_COUNT > 0 }}
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        document: ${{ env.TELEGRAM_ASSETS }}
        message: |
          <b>📦 TWRP Build Artifacts</b>
          <b>Device:</b> <code>${{ github.event.inputs.DEVICE_NAME }}</code>
          <b>Contains:</b>
          - ${{ env.RECOVERY_FILE }}
          - recovery-installer.zip
          - ${{ env.RECOVERY_TYPE }}.tar (if created)
        format: html

    - name: Send Telegram Failure Notification
      if: ${{ failure() }}
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        message: |
          <b>❌ TWRP Build Failed!</b>
          <b>Builder:</b> <code>${{ env.BUILD_AUTHOR }}</code>
          <b>Device:</b> <code>${{ github.event.inputs.DEVICE_NAME }}</code>
          <b>Target:</b> <code>${{ github.event.inputs.BUILD_TARGET }}</code>
          <b>Date:</b> <code>${{ env.BUILD_DATE }} ${{ env.BUILD_TIME }}</code>
          
          <b>📝 Error Logs:</b> <a href="${{ env.BUILD_LOG_URL }}">View</a>
        format: html

    - name: Checking For Missing Dependencies
      run: |
        cd tools
        mv -n libneeds ${GITHUB_WORKSPACE}/workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery/root/
        mv -n ldcheck ${GITHUB_WORKSPACE}/workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery/root/
        cd ../workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery/root
        python3 ldcheck -p system/lib64:vendor/lib64:system/lib:vendor/lib -d ${{ github.event.inputs.LDCHECK }}
        echo "Done checking missing dependencies. Review, and reconfigure your tree."
      continue-on-error: true
