name: TWRP Recovery Builder ares 2025

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'TWRP Minimal-Manifest Branch'
        required: true
        default: 'twrp-12.1'
        type: choice
        options:
        - twrp-14.1
        - twrp-12.1
        - twrp-11
        - twrp-9.0
      DEVICE_TREE:
        description: 'Custom Recovery Tree' 
        required: true
        default: 'https://github.com/abrohim0786/device_xiaomi_ares.git'
      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch' 
        required: true
        default: 'TWRP-12.1'
      DEVICE_PATH:
        description: 'Specify your Device Path' 
        required: true
        default: 'device/xiaomi/ares'
      DEVICE_NAME:
        description: 'Specify your Device Codename' 
        required: true
        default: 'ares'
      BUILD_TARGET:
        description: 'Specify your Build Target' 
        required: true
        default: 'boot'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot
      LDCHECK:
        description: 'Path of blobs to check' 
        required: true
        default: 'system/bin/qseecomd'
      RECOVERY_TAR:
        description: 'Release Recovery.tar For Samsung devices'
        required: false
        default: false
        type: boolean
      RECOVERY_INSTALLER:
        description: 'Include recovery installer.zip'
        type: boolean
        required: true
        default: true

jobs:
  build:
    name: Build TWRP by ${{ github.actor }}
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_LOG: build.log
    permissions:
      contents: write
    steps:
    - name: Check Out
      uses: actions/checkout@v4
      
    - name: Display Inputs
      run: |
        echo "::group::📋 Workflow Input Parameters"
        echo "Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
        echo "Device Tree: ${{ github.event.inputs.DEVICE_TREE }}"
        echo "Device Branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
        echo "Device Path: ${{ github.event.inputs.DEVICE_PATH }}"
        echo "Device Name: ${{ github.event.inputs.DEVICE_NAME }}"
        echo "Build Target: ${{ github.event.inputs.BUILD_TARGET }}"
        echo "Include Recovery Installer: ${{ github.event.inputs.RECOVERY_INSTALLER }}"
        echo "Release recovery.tar For Samsung: ${{ github.event.inputs.RECOVERY_TAR }}"
        echo "LDCHECK Path: ${{ github.event.inputs.LDCHECK }}"
        echo "::endgroup::"

    - name: Cleanup Workspace
      uses: rokibhasansagar/slimhub_actions@main
      
    - name: Free Disk Space
      run: |
        echo "🔄 Cleaning up disk space..."
        sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true
        sudo docker rmi $(sudo docker images -q) || true
        echo "✅ Disk space cleaned"

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24
        
    - name: Install Build Dependencies
      run: |
        echo "::group::📦 Installing Dependencies"
        sudo apt update -y
        sudo apt upgrade -y
        sudo dpkg --add-architecture i386
        sudo apt update -y
        sudo apt install -y \
          gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
          ncurses-dev x11proto-core-dev lib32z-dev libgl1-mesa-dev \
          libxml2-utils xsltproc bc ccache lib32readline-dev lib32z1-dev \
          liblz4-tool libsdl1.2-dev libwxgtk3.2-dev lzop pngcrush \
          schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp \
          qemu-user-static libstdc++-10-dev libtinfo6 libgflags-dev \
          libncurses6 libncurses6:i386 git-lfs
        sudo add-apt-repository universe -y
        echo "::endgroup::"
       
    - name: Setup Java Environment
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: 8

    - name: Install Repo Tool
      run: |
        echo "📥 Installing repo tool..."
        mkdir -p ~/bin
        curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo
        echo "✅ Repo tool installed"

    - name: Determine Manifest URL
      uses: haya14busa/action-cond@v1
      id: manifest
      with:
        cond: ${{ github.event.inputs.MANIFEST_BRANCH == 'twrp-11' || github.event.inputs.MANIFEST_BRANCH == 'twrp-12.1'  || github.event.inputs.MANIFEST_BRANCH == 'twrp-14.1' }}
        if_true: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
        if_false: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git

    - name: Initialize Repo
      run: |
        echo "::group::🔄 Initializing Repo"
        mkdir -p workspace
        cd workspace
        git config --global user.name "abrohim0786"
        git config --global user.email "callofduty.pubg786@gmail.com"
        repo init --depth=1 -u ${{ steps.manifest.outputs.value }} -b ${{ github.event.inputs.MANIFEST_BRANCH }}
        echo "::endgroup::"
  
    - name: Sync Repositories
      timeout-minutes: 30
      run: |
        echo "::group::🔄 Syncing Repositories"
        cd workspace
        repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle --force-sync
        echo "::endgroup::"

    - name: Clone Device Tree
      run: |
        echo "::group::🌳 Cloning Device Tree"
        cd workspace
        git clone ${{ github.event.inputs.DEVICE_TREE }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
        cd ${{ github.event.inputs.DEVICE_PATH }}
        git lfs pull
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV
        echo "::endgroup::"

    - name: Identify Makefile
      run: |
        echo "::group::🔍 Identifying Makefile"
        cd workspace
        if [ -f ${{ github.event.inputs.DEVICE_PATH }}/twrp_${{ github.event.inputs.DEVICE_NAME}}.mk ]; then
            echo "DEVICE_MAKEFILE=twrp_${{ github.event.inputs.DEVICE_NAME }}" >> $GITHUB_ENV
            echo "Found twrp makefile!"
        elif [ -f ${{ github.event.inputs.DEVICE_PATH }}/omni_${{ github.event.inputs.DEVICE_NAME}}.mk ]; then
            echo "DEVICE_MAKEFILE=omni_${{ github.event.inputs.DEVICE_NAME }}" >> $GITHUB_ENV
            echo "Found omni makefile!"
        else
            echo "❌ No recovery makefile found!"
            exit 1
        fi
        echo "::endgroup::"
      
    - name: Install Python 2 (if needed)
      if: github.event.inputs.MANIFEST_BRANCH != 'twrp-11' && github.event.inputs.MANIFEST_BRANCH != 'twrp-12.1'  && github.event.inputs.MANIFEST_BRANCH != 'twrp-14'
      run: |
        echo "🐍 Installing Python 2"
        sudo apt install -y python2
        sudo ln -sf /usr/bin/python2 /usr/bin/python
        echo "✅ Python 2 installed"

    - name: Build Recovery Image
      timeout-minutes: 120
      run: |
        echo "::group::🏗️ Starting Build Process"
        cd workspace
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export USE_CCACHE=1
        export CCACHE_DIR=~/.ccache
        ccache -M 50G
        ccache -z
        
        echo "🍽️ Running lunch command..."
        lunch ${{ env.DEVICE_MAKEFILE }}-eng
        
        echo "🧹 Cleaning previous build..."
        make clean
        
        echo "🔨 Building ${{ github.event.inputs.BUILD_TARGET }}image..."
        make ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all) 2>&1 | tee ${{ env.BUILD_LOG }}
        
        if [ ${PIPESTATUS[0]} -ne 0 ]; then
          echo "❌ Build failed!"
          echo "::group::📄 Build Log Tail"
          tail -n 100 ${{ env.BUILD_LOG }}
          echo "::endgroup::"
          exit 1
        fi
        
        echo "✅ Build completed successfully!"
        echo "::endgroup::"
      
    - name: Set Build Metadata
      run: |
        echo "📅 Setting build metadata..."
        echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
        DEVICE_TREE_URL="${{ github.event.inputs.DEVICE_TREE }}"
        if [[ "${DEVICE_TREE_URL}" == *.git ]]; then
          DEVICE_TREE_URL="${DEVICE_TREE_URL%.git}"
        fi
        echo "DEVICE_TREE_URL=${DEVICE_TREE_URL}" >> $GITHUB_ENV

    - name: Locate Built Image
      run: |
        echo "::group::🔍 Locating Built Image"
        cd workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}
        
        if [ -f recovery.img ]; then
            echo "RECOVERY_TYPE=recovery" >> $GITHUB_ENV
            echo "MD5_IMG=$(md5sum recovery.img | cut -d ' ' -f 1)" >> $GITHUB_ENV
            echo "Found recovery.img"
        elif [ -f boot.img ]; then
            echo "RECOVERY_TYPE=boot" >> $GITHUB_ENV
            echo "MD5_IMG=$(md5sum boot.img | cut -d ' ' -f 1)" >> $GITHUB_ENV
            echo "Found boot.img"
        elif [ -f vendor_boot.img ]; then
            echo "RECOVERY_TYPE=vendor_boot" >> $GITHUB_ENV
            echo "MD5_IMG=$(md5sum vendor_boot.img | cut -d ' ' -f 1)" >> $GITHUB_ENV
            echo "Found vendor_boot.img"
        else
            echo "❌ No recovery image found!"
            echo "::group::📄 Build Log Tail"
            tail -n 100 ${{ env.BUILD_LOG }}
            echo "::endgroup::"
            exit 1
        fi
        echo "::endgroup::"

    - name: Create Recovery Installer
      if: ${{ github.event.inputs.RECOVERY_INSTALLER }}
      run: |
        echo "::group::📦 Creating Recovery Installer"
        cd workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}
        wget -q https://github.com/kinguser981/recovery-installer/releases/download/zip/recovery-installer.zip
        zip -ur recovery-installer.zip ${{ env.RECOVERY_TYPE }}.img
        echo "✅ Recovery installer created"
        echo "::endgroup::"

    - name: Create Samsung Recovery Tar
      if: ${{ github.event.inputs.RECOVERY_TAR }}
      run: |
        echo "::group::📦 Creating Samsung Recovery Tar"
        cd workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}
        tar -cvf ${{ env.RECOVERY_TYPE }}.tar ${{ env.RECOVERY_TYPE }}.img
        echo "✅ Samsung recovery tar created"
        echo "::endgroup::"

    - name: Upload Build Artifacts
      uses: softprops/action-gh-release@v1
      with:
        files: |
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery-installer.zip
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ env.RECOVERY_TYPE }}.img
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ env.RECOVERY_TYPE }}.tar
          ${{ env.BUILD_LOG }}
        name: TWRP-${{ github.event.inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}
        tag_name: build-${{ github.run_id }}
        body: |
          ### Build Details
          - **Device**: ${{ github.event.inputs.DEVICE_NAME }}
          - **Manifest**: ${{ github.event.inputs.MANIFEST_BRANCH }}
          - **Build Target**: ${{ github.event.inputs.BUILD_TARGET }}
          - **Device Tree**: [${{ github.event.inputs.DEVICE_TREE_BRANCH }}](${{ env.DEVICE_TREE_URL }}/tree/${{ github.event.inputs.DEVICE_TREE_BRANCH }})
          - **Latest Commit**: [$(echo ${{ env.COMMIT_ID }} | cut -c1-7)](${{ env.DEVICE_TREE_URL }}/commit/${{ env.COMMIT_ID }})
          - **MD5**: `${{ env.MD5_IMG }}`
          - **Build Date**: ${{ env.BUILD_DATE }}

    - name: Check Dependencies
      run: |
        echo "::group::🔍 Checking Dependencies"
        cd workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery/root
        mkdir -p tools
        cd tools
        wget -q https://raw.githubusercontent.com/LineageOS/android_vendor_lineage/build/tools/libneeds
        wget -q https://raw.githubusercontent.com/LineageOS/android_vendor_lineage/build/tools/ldcheck
        chmod +x ldcheck
        python3 ldcheck -p system/lib64:vendor/lib64:system/lib:vendor/lib -d ${{ github.event.inputs.LDCHECK }}
        echo "::endgroup::"
      continue-on-error: true

    - name: Upload Ramdisk Artifacts
      if: always()
      uses: softprops/action-gh-release@v1
      with:
        files: |
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/obj/PACKAGING/vendor_ramdisk_fragments_intermediates/recovery.*
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/ramdisk-recovery.*
        tag_name: build-${{ github.run_id }}
        body: |
          Ramdisk artifacts for ${{ github.event.inputs.DEVICE_NAME }}
          Build ID: ${{ github.run_id }}
