#
# TWRP Recovery Builder - Upgraded by Gemini (v2)
#
# This workflow is designed to build TWRP recovery from source.
# It includes several enhancements for stability, speed, and customization.
# This version fixes a syntax error and adds an optional Telegram upload feature.
#

name: TWRP Recovery Builder (Upgraded v2)

on:
  workflow_dispatch:
    inputs:      
      MANIFEST_BRANCH:
        description: 'TWRP Minimal-Manifest Branch'
        required: true
        default: 'twrp-12.1'
        type: choice
        options:
          - twrp-14.1
          - twrp-12.1
          - twrp-11
          - twrp-9.0
      DEVICE_TREE:
        description: 'Custom Recovery Tree URL'
        required: true
        default: 'https://github.com/abrohim0786/device_xiaomi_ares.git'
      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch'
        required: true
        default: 'TWRP-12.1'
      DEVICE_PATH:
        description: 'Specify your Device Path (e.g., device/xiaomi/ares)'
        required: true
        default: 'device/xiaomi/ares'
      DEVICE_NAME:
        description: 'Specify your Device Codename (e.g., ares)'
        required: true
        default: 'ares'
      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'boot'
        type: choice
        options:
          - boot
          - recovery
          - vendorboot
      UPLOAD_RECOVERY_LOGS:
        description: 'Upload build logs as an artifact'
        type: boolean
        required: true
        default: true
      RECOVERY_INSTALLER:
        description: 'Include recovery installer.zip'
        type: boolean
        required: true
        default: true
      RECOVERY_TAR:
        description: 'Create recovery.tar for Samsung devices'
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build TWRP for ${{ github.event.inputs.DEVICE_NAME }}
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Display Build Information
      run: |
        echo "========================================"
        echo "         TWRP BUILDER (UPGRADED)        "
        echo "========================================"
        echo "::group::Build Configuration"
        echo "Manifest URL: ${{ github.event.inputs.MANIFEST_URL }}"
        echo "Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
        # ... and so on for other inputs
        echo "::endgroup::"

    - name: Maximize Build Space
      uses: easimon/maximize-build-space@v10
      with:
        root-reserve-mb: 512
        swap-size-mb: 12288
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'

    - name: Set up Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libwxgtk3.0-gtk3-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3
        sudo ln -sf /usr/bin/python3 /usr/bin/python

    - name: Install OpenJDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '8'

    - name: Install git-repo
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Set up ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-${{ github.event.inputs.DEVICE_NAME }}-${{ github.event.inputs.MANIFEST_BRANCH }}-${{ github.run_id }}
        restore-keys: |
          ccache-${{ github.event.inputs.DEVICE_NAME }}-${{ github.event.inputs.MANIFEST_BRANCH }}-

    - name: Initialize Repo & Get Commit ID
      id: init
      run: |
        mkdir -p workspace
        cd workspace
        git config --global user.name "abrohim0786"
        git config --global user.email "callofduty.pubg786@gmail.com"
        repo init -u ${{ github.event.inputs.MANIFEST_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }} --depth=1 --git-lfs
        git clone ${{ github.event.inputs.DEVICE_TREE }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
        cd ${{ github.event.inputs.DEVICE_PATH }}
        echo "commit_id=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
        cd ../..

    - name: Repo Sync
      run: |
        cd workspace
        repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune --force-sync -j$(nproc --all)

    - name: Set up Build Vars
      id: set_build_vars
      run: |
        cd workspace
        if [ -f ${{ github.event.inputs.DEVICE_PATH }}/twrp.mk ]; then
            MAKEFILE_NAME=$(basename ${{ github.event.inputs.DEVICE_PATH }}/twrp.mk .mk)
            echo "device_makefile=${MAKEFILE_NAME}" >> $GITHUB_OUTPUT
        elif [ -f ${{ github.event.inputs.DEVICE_PATH }}/omni_${{ github.event.inputs.DEVICE_NAME}}.mk ]; then
            echo "device_makefile=omni_${{ github.event.inputs.DEVICE_NAME}}" >> $GITHUB_OUTPUT
        else
            echo "❌ No suitable recovery makefile found!"
            exit 1
        fi

    - name: Start Compilation
      run: |
        cd workspace
        source build/envsetup.sh
        lunch ${{ steps.set_build_vars.outputs.device_makefile }}-eng
        export ALLOW_MISSING_DEPENDENCIES=true
        export CCACHE_EXEC=$(which ccache)
        export USE_CCACHE=1
        ccache -M 50G
        ccache -z
        make ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all) 2>&1 | tee build.log
        ccache -s

    - name: Prepare Artifacts and Release Info
      id: prep
      run: |
        cd workspace
        OUT_DIR="out/target/product/${{ github.event.inputs.DEVICE_NAME }}"
        IMG_FILE="${{ github.event.inputs.BUILD_TARGET }}.img"
        IMG_PATH="${OUT_DIR}/${IMG_FILE}"
        
        if [ -f "${IMG_PATH}" ]; then
          echo "Build successful: ${IMG_PATH} found."
        else
          echo "❌ Build failed: Image not found in ${OUT_DIR}!"
          if [ ${{ github.event.inputs.UPLOAD_RECOVERY_LOGS }} = true ]; then
            mv build.log recovery_build_failed.log
            echo "upload_log_path=recovery_build_failed.log" >> $GITHUB_OUTPUT
          fi
          exit 1
        fi

        INSTALLER_ZIP="TWRP_${{ github.event.inputs.DEVICE_NAME }}_Installer.zip"
        if [ ${{ github.event.inputs.RECOVERY_INSTALLER }} = true ]; then
          wget -q https://github.com/kinguser981/recovery-installer/releases/download/zip/recovery-installer.zip -P ${OUT_DIR}
          zip -j -r ${OUT_DIR}/${INSTALLER_ZIP} ${OUT_DIR}/recovery-installer.zip ${IMG_PATH}
          echo "installer_zip_path=${OUT_DIR}/${INSTALLER_ZIP}" >> $GITHUB_OUTPUT
        fi
        
        SAMSUNG_TAR="TWRP_${{ github.event.inputs.DEVICE_NAME }}.tar"
        if [ ${{ github.event.inputs.RECOVERY_TAR }} = true ]; then
          tar -cvf ${OUT_DIR}/${SAMSUNG_TAR} -C ${OUT_DIR} ${IMG_FILE}
          echo "samsung_tar_path=${OUT_DIR}/${SAMSUNG_TAR}" >> $GITHUB_OUTPUT
        fi
        
        echo "build_date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT
        echo "img_md5=$(md5sum ${IMG_PATH} | cut -d' ' -f1)" >> $GITHUB_OUTPUT
        echo "img_path=${IMG_PATH}" >> $GITHUB_OUTPUT

        if [ ${{ github.event.inputs.UPLOAD_RECOVERY_LOGS }} = true ]; then
          mv build.log recovery_build_success.log
          echo "upload_log_path=recovery_build_success.log" >> $GITHUB_OUTPUT
        fi

    - name: Upload Build Logs
      if: always() && steps.prep.outputs.upload_log_path
      uses: actions/upload-artifact@v4
      with:
        name: recovery-build-logs-${{ github.run_id }}
        path: workspace/${{ steps.prep.outputs.upload_log_path }}

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: "TWRP for ${{ github.event.inputs.DEVICE_NAME }} | ${{ steps.prep.outputs.build_date }}"
        tag_name: "twrp-${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}"
        body: |
          ## Unofficial TWRP Build
          This is an automated build of TWRP for the **${{ github.event.inputs.DEVICE_NAME }}**.
          - **Build Date:** ${{ steps.prep.outputs.build_date }}
          - **Manifest Branch:** `${{ github.event.inputs.MANIFEST_BRANCH }}`
          - **Device Tree Commit:** [${{ steps.init.outputs.commit_id }}](${{ github.event.inputs.DEVICE_TREE }}/commit/${{ steps.init.outputs.commit_id }})
          - **Image MD5:** `${{ steps.prep.outputs.img_md5 }}`
          **Note:** Always back up your data before flashing. Use at your own risk.
        files: |
          ${{ steps.prep.outputs.img_path }}
          ${{ steps.prep.outputs.installer_zip_path }}
          ${{ steps.prep.outputs.samsung_tar_path }}
        fail_on_unmatched_files: false

    - name: Send Build File to Telegram
      # To use this, you must add TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID to your repository's secrets.
      # Go to Repo Settings > Secrets and variables > Actions > New repository secret
      if: success() # Only run on successful build
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        message: |
          *✅ TWRP Build Successful*

          *Device:* `${{ github.event.inputs.DEVICE_NAME }}`
          *Date:* `${{ steps.prep.outputs.build_date }}`
          *Manifest:* `${{ github.event.inputs.MANIFEST_BRANCH }}`
          *MD5:* `${{ steps.prep.outputs.img_md5 }}`
        document: ${{ steps.prep.outputs.img_path }}
        # You can uncomment the line below to send the installer zip instead of the raw image
        # document: ${{ steps.prep.outputs.installer_zip_path }}

