name: TWRP Recovery Builder Pro (16-Cores)

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'TWRP Minimal-Manifest Branch'
        required: true
        default: 'twrp-12.1'
        type: choice
        options:
        - twrp-14.1
        - twrp-12.1
        - twrp-11
        - twrp-9.0
      DEVICE_TREE:
        description: 'Custom Recovery Tree' 
        required: true
        default: 'https://github.com/abrohim0786/device_xiaomi_ares.git'
      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch' 
        required: true
        default: 'TWRP-12.1'
      DEVICE_PATH:
        description: 'Specify your Device Path' 
        required: true
        default: 'device/xiaomi/ares'
      DEVICE_NAME:
        description: 'Specify your Device Codename' 
        required: true
        default: 'ares'
      BUILD_TARGET:
        description: 'Specify your Build Target' 
        required: true
        default: 'boot'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot
      LDCHECK:
        description: 'Path of blobs to check' 
        required: true
        default: 'system/bin/qseecomd'
      RECOVERY_TAR:
        description: 'Release Recovery.tar For Samsung devices'
        required: false
        default: false
        type: boolean
      RECOVERY_INSTALLER:
        description: 'Include recovery installer.zip'
        type: boolean
        required: true
        default: true

jobs:
  build:
    name: Build TWRP Pro by ${{ github.actor }}
    runs-on: ubuntu-latest-16-cores
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_LOG: build.log
      CCACHE_DIR: /github/workspace/.ccache
      CCACHE_COMPRESS: 1
      CCACHE_COMPRESSLEVEL: 6
      CCACHE_MAXSIZE: 50G
    permissions:
      contents: write
    steps:
    - name: Check Out
      uses: actions/checkout@v4
      
    - name: Display System Info
      run: |
        echo "::group::🖥️ System Information"
        echo "CPU Cores: $(nproc)"
        echo "Total RAM: $(free -h | awk '/Mem:/{print $2}')"
        echo "Swap Space: $(free -h | awk '/Swap:/{print $2}')"
        echo "Disk Space: $(df -h / | awk 'NR==2{print $4}') free"
        echo "::endgroup::"

    - name: Setup Build Environment
      run: |
        echo "::group::📋 Workflow Input Parameters"
        echo "Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
        echo "Device Tree: ${{ github.event.inputs.DEVICE_TREE }}"
        echo "Device Branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
        echo "Device Path: ${{ github.event.inputs.DEVICE_PATH }}"
        echo "Device Name: ${{ github.event.inputs.DEVICE_NAME }}"
        echo "Build Target: ${{ github.event.inputs.BUILD_TARGET }}"
        echo "Include Recovery Installer: ${{ github.event.inputs.RECOVERY_INSTALLER }}"
        echo "Release recovery.tar For Samsung: ${{ github.event.inputs.RECOVERY_TAR }}"
        echo "LDCHECK Path: ${{ github.event.inputs.LDCHECK }}"
        echo "::endgroup::"

    - name: Turbo Boost Setup
      run: |
        echo "::group::🚀 Turbo Boost Configuration"
        # Set CPU governor to performance mode
        sudo apt install -y linux-tools-common
        for i in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do
          echo "performance" | sudo tee $i
        done
        # Increase file watcher limits
        echo "fs.inotify.max_user_watches=524288" | sudo tee -a /etc/sysctl.conf
        sudo sysctl -p
        # Optimize swapiness
        echo "vm.swappiness=10" | sudo tee -a /etc/sysctl.conf
        sudo sysctl -p
        echo "::endgroup::"

    - name: Install Build Dependencies
      run: |
        echo "::group::📦 Installing Dependencies (Parallel)"
        sudo apt update -y
        sudo DEBIAN_FRONTEND=noninteractive apt upgrade -y
        
        # Parallel package installation
        sudo apt install -y --no-install-recommends \
          gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
          ncurses-dev x11proto-core-dev lib32z-dev libgl1-mesa-dev \
          libxml2-utils xsltproc bc ccache lib32readline-dev lib32z1-dev \
          liblz4-tool libsdl1.2-dev libwxgtk3.2-dev lzop pngcrush \
          schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp \
          qemu-user-static libstdc++-10-dev libtinfo6 libgflags-dev \
          libncurses6 libncurses6:i386 git-lfs python-is-python3 \
          zlib1g-dev flex bison build-essential zip curl gnupg \
          python3 python3-pip rsync aria2 patchelf &
        
        sudo dpkg --add-architecture i386
        sudo apt update -y
        sudo add-apt-repository universe -y
        wait
        echo "::endgroup::"
       
    - name: Setup Java Environment
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: 8

    - name: Install Repo Tool (Optimized)
      run: |
        echo "::group::⚡ Installing Repo Tool"
        mkdir -p ~/bin
        aria2c -x16 -s16 -k1M https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo
        echo "::endgroup::"

    - name: Configure CCACHE
      run: |
        echo "::group::🌀 CCACHE Configuration"
        mkdir -p $CCACHE_DIR
        ccache -o compression=true
        ccache -o compression_level=6
        ccache -o max_size=$CCACHE_MAXSIZE
        ccache -z
        echo "CCACHE STATS:"
        ccache -s
        echo "::endgroup::"

    - name: Determine Manifest URL
      uses: haya14busa/action-cond@v1
      id: manifest
      with:
        cond: ${{ github.event.inputs.MANIFEST_BRANCH == 'twrp-11' || github.event.inputs.MANIFEST_BRANCH == 'twrp-12.1'  || github.event.inputs.MANIFEST_BRANCH == 'twrp-14.1' }}
        if_true: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
        if_false: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git

    - name: Initialize Repo (Turbo Mode)
      run: |
        echo "::group::⚡ Initializing Repo (Depth 1)"
        mkdir -p workspace
        cd workspace
        git config --global user.name "abrohim0786"
        git config --global user.email "callofduty.pubg786@gmail.com"
        git config --global core.compression 9
        git config --global pack.depth 1
        repo init --depth=1 -u ${{ steps.manifest.outputs.value }} -b ${{ github.event.inputs.MANIFEST_BRANCH }} --repo-rev=main --repo-url=https://gerrit.googlesource.com/git-repo
        echo "::endgroup::"
  
    - name: Sync Repositories (Parallel)
      timeout-minutes: 20
      run: |
        echo "::group::⚡ Syncing Repositories (16 threads)"
        cd workspace
        repo sync -c -j16 --no-tags --no-clone-bundle --force-sync --optimized-fetch --prune
        echo "::endgroup::"

    - name: Clone Device Tree (Optimized)
      run: |
        echo "::group::🌳 Cloning Device Tree (Depth 1)"
        cd workspace
        git clone --depth=1 --single-branch ${{ github.event.inputs.DEVICE_TREE }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
        cd ${{ github.event.inputs.DEVICE_PATH }}
        git lfs pull
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV
        echo "::endgroup::"

    - name: Build Process (Turbo Mode)
      timeout-minutes: 90
      run: |
        echo "::group::🚀 Starting Turbo Build"
        cd workspace
        
        # Setup environment
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export USE_CCACHE=1
        export CCACHE_CPP2=yes
        export CCACHE_SLOPPINESS=file_macro,locale,time_macros
        export CCACHE_NOHASHDIR=true
        
        # Pre-build optimizations
        echo "🧹 Cleaning previous build..."
        make clean
        ccache -c
        
        echo "🍽️ Configuring lunch..."
        lunch ${{ env.DEVICE_MAKEFILE }}-eng
        
        echo "⚡ Building with 16 threads..."
        time make -j16 ${{ github.event.inputs.BUILD_TARGET }}image 2>&1 | tee ${{ env.BUILD_LOG }}
        
        if [ ${PIPESTATUS[0]} -ne 0 ]; then
          echo "❌ Build failed!"
          echo "::group::📄 Build Log Tail"
          tail -n 100 ${{ env.BUILD_LOG }}
          echo "::endgroup::"
          exit 1
        fi
        
        echo "✅ Build completed successfully!"
        ccache -s
        echo "::endgroup::"
      
    - name: Package Artifacts
      run: |
        echo "::group::📦 Packaging Artifacts"
        cd workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}
        
        # Identify recovery image
        if [ -f recovery.img ]; then
            echo "RECOVERY_TYPE=recovery" >> $GITHUB_ENV
            echo "MD5_IMG=$(md5sum recovery.img | cut -d ' ' -f 1)" >> $GITHUB_ENV
        elif [ -f boot.img ]; then
            echo "RECOVERY_TYPE=boot" >> $GITHUB_ENV
            echo "MD5_IMG=$(md5sum boot.img | cut -d ' ' -f 1)" >> $GITHUB_ENV
        elif [ -f vendor_boot.img ]; then
            echo "RECOVERY_TYPE=vendor_boot" >> $GITHUB_ENV
            echo "MD5_IMG=$(md5sum vendor_boot.img | cut -d ' ' -f 1)" >> $GITHUB_ENV
        else
            echo "❌ No recovery image found!"
            exit 1
        fi
        
        # Create installer if requested
        if [ ${{ github.event.inputs.RECOVERY_INSTALLER }} = true ]; then
          aria2c -x16 -s16 https://github.com/kinguser981/recovery-installer/releases/download/zip/recovery-installer.zip
          zip -ur recovery-installer.zip ${{ env.RECOVERY_TYPE }}.img
        fi
        
        # Create tar if requested
        if [ ${{ github.event.inputs.RECOVERY_TAR }} = true ]; then
          tar -cvf ${{ env.RECOVERY_TYPE }}.tar ${{ env.RECOVERY_TYPE }}.img
        fi
        echo "::endgroup::"

    - name: Upload Artifacts
      uses: softprops/action-gh-release@v1
      with:
        files: |
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery-installer.zip
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ env.RECOVERY_TYPE }}.img
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ env.RECOVERY_TYPE }}.tar
          ${{ env.BUILD_LOG }}
        name: TWRP-Pro-${{ github.event.inputs.DEVICE_NAME }}-$(date +%Y%m%d)
        tag_name: pro-build-${{ github.run_id }}
        body: |
          ### 🚀 Turbo Build Report
          - **Device**: ${{ github.event.inputs.DEVICE_NAME }}
          - **Build Time**: $(date -u)
          - **Build Duration**: ${{ job.status }} seconds
          - **CPU Cores**: 16
          - **CCACHE Stats**:
          ```
          $(ccache -s)
          ```

    - name: Performance Report
      if: always()
      run: |
        echo "::group::📊 Performance Metrics"
        echo "Build duration: $SECONDS seconds"
        echo "CPU usage:"
        mpstat -P ALL
        echo "Memory usage:"
        free -h
        echo "Disk usage:"
        df -h
        echo "CCACHE stats:"
        ccache -s
        echo "::endgroup::"
